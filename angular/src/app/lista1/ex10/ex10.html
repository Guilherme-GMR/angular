<p>Usuario: <input type="text" [(ngModel)]= "usuario" placeholder="informe aqui"></p>

<p>Senha: <input type="text" [(ngModel)]= "senha" placeholder="informe aqui"></p>

<button [disabled]="usuario === '' || senha === ''"(click)="entrar()">
    
    Entrar </button>

  <div *ngIf="resultado"> <p>Bem vindo! {{ usuario }}</p>
  </div>
