<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Produto</label>
    <input type="text" [(ngModel)]="produto" placeholder="informe o produto">

    <label>Preço</label>
    <input type="number" [(ngModel)]="preco" placeholder="Informe o preço">

    <label>Quantidade</label>
    <input type="number" [(ngModel)]="quantidade" placeholder="informe a quantidade">

    <p>Produto: {{produto}}</p>

    <p>Preço: {{ preco | currency:'BRL' }}</p>
    
    <p>Quantidade: {{quantidade}}</p>

    <p>Total: {{ total | currency:'BRL' }}</p>

</body>
</html>
