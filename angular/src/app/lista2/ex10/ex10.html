<h2>Promoção e estilo dinâmico</h2>

<ul>
  <li *ngFor="let produto of produtos">

    <p [ngStyle]="{'font-weight': produto.promocao ? 'bold' : 'normal'}">
      {{ produto.nome }}
    </p>

    <p
      [ngStyle]="{
        'color': produto.promocao ? 'red' : 'black'
      }">
      Preço: {{ produto.preco | currency:'BRL' }}
    </p>

    @if (produto.promocao) {
      <p>Produto em promoção</p>
    }

    <button (click)="alterarPromocao(produto)">
      @if (produto.promocao) {
        Desativar promoção
      } @else {
        Ativar promoção
      }
    </button>

  </li>
</ul>
