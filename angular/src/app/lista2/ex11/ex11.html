<h2>Produtos disponíveis</h2>

<button (click)="alterarFiltro()">
  @if (somenteDisponiveis) {
    Mostrar todos
  } @else {
    Mostrar somente disponíveis
  }
</button>

<ul>
  <ng-container *ngFor="let produto of produtos">

    @if (!somenteDisponiveis || produto.quantidade > 0) {
      <li>
        <p>Nome: {{ produto.nome }}</p>
        <p>Preço: {{ produto.preco | currency:'BRL' }}</p>
        <p>Quantidade: {{ produto.quantidade }}</p>
      </li>
    }

  </ng-container>
</ul>
